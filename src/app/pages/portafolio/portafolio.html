<section class="ae-container-fluid rk-main">
  <section class="ae-container-fluid ae-container-fluid--inner rk-portfolio">

    <!-- Loader SOLO mientras carga -->
    <ng-container *ngIf="productosService.cargando; else productosGrid">
      <div class="loading" style="text-align:center; padding:2rem 0;">
        <h2>Cargando</h2>

        <div class="loader loader--style1" title="0" style="margin:1rem auto;">
          <svg version="1.1" width="40" height="40" viewBox="0 0 40 40" aria-label="Cargando">
            <path opacity="0.2" fill="#000"
              d="M20.201,5.169c-8.254,0-14.946,6.692-14.946,14.946c0,8.255,6.692,14.946,14.946,14.946
                 s14.946-6.691,14.946-14.946C35.146,11.861,28.455,5.169,20.201,5.169z M20.201,31.749c-6.425,0-11.634-5.208-11.634-11.634
                 c0-6.425,5.209-11.634,11.634-11.634c6.425,0,11.633,5.209,11.633,11.634C31.834,26.541,26.626,31.749,20.201,31.749z" />
            <path fill="#000"
              d="M26.013,10.047l1.654-2.866c-2.198-1.272-4.743-2.012-7.466-2.012h0v3.312h0
                 C22.32,8.481,24.301,9.057,26.013,10.047z">
              <animateTransform attributeType="xml" attributeName="transform"
                type="rotate" from="0 20 20" to="360 20 20" dur="0.5s"
                repeatCount="indefinite" />
            </path>
          </svg>
        </div>

        <p>Espere por favor</p>
      </div>
    </ng-container>

    <!-- Grilla cuando ya cargó -->
    <ng-template #productosGrid>
      <!-- opcional: mensaje si no hay productos -->
      <div *ngIf="productosService.productos?.length === 0" class="ae-u-ta-center" style="padding:2rem 0;">
        No hay productos para mostrar.
      </div>

      <div class="ae-masonry ae-masonry-md-2 ae-masonry-xl-4"
           *ngIf="productosService.productos?.length">
        <a *ngFor="let producto of productosService.productos"
           [routerLink]="['/item', producto.cod]"
           class="rk-item ae-masonry__item">
          <img
            [src]="'assets/productos/' + producto.url + '.jpg'"
            [alt]="producto.titulo || 'Producto'" />
          <div class="item-meta">
            <h2>{{ producto.titulo }}</h2>
            <p>{{ producto.categoria }}</p>
          </div>
        </a>
      </div>
    </ng-template>

  </section>
</section>
